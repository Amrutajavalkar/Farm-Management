      </div>
    </div>`;

  const searchPanel = `
  <div class="panel">

    <div class="add-form open" style="border:none; padding:0; background:transparent;">
      <div class="field" style="flex:1; min-width:200px;"><input type="text" id="search-input" placeholder="Type a name or email…"></div>
      <button class="btn btn-primary" onclick="runSearch()">Search</button>
    </div>
    <div id="search-results">${renderSearchResults()}</div>
  </div>`;

  const incoming = myPendingIncoming();
  const incomingPanel = incoming.length ? `
  <div class="panel">
    <h4>Requests Waiting On You</h4>
    ${incoming.map(c => {
      const p = otherParty(c);
      return `<div class="row-item">
        <div class="row-left"><div class="avatar">${esc(initials(p.name))}</div>
          <div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.village||'')}</div></div></div>
        <div class="row-actions">
          <button class="btn btn-small btn-primary" onclick="acceptConnection('${c._id}')">Accept</button>
          <button class="btn btn-small btn-danger" onclick="rejectConnection('${c._id}')">Decline</button>
        </div>
      </div>`;
    }).join('')}
  </div>` : '';

  const outgoing = myPendingOutgoing();
  const outgoingPanel = outgoing.length ? `
  <div class="panel">
    <h4>Sent Requests (Awaiting Them)</h4>
    ${outgoing.map(c => {
      const p = otherParty(c);
      return `<div class="row-item">
        <div class="row-left"><div class="avatar">${esc(initials(p.name))}</div><div class="name">${esc(p.name)}</div></div>
        <span class="badge badge-gray">Pending</span>
      </div>`;
    }).join('')}
  </div>` : '';

  const accepted = myAcceptedConnections();
  const connectedPanel = `
  <div class="panel">
    <h4>${isFarmer ? 'Connected Workers' : 'Connected Farmers'}</h4>

  const requestsPanel = renderWorkRequestsPanel();

  ${connectedPanel}
  ${requestsPanel}`;

function renderSearchResults(){
  if(!searchResults.length) return '';
  return searchResults.map(u => {
    const existing = u.connection;
    let actionHtml = `<button class="btn btn-small btn-primary" onclick="sendConnectionRequest('${u._id}')">Connect</button>`;
    if(existing){
      if(existing.status === 'accepted') actionHtml = `<span class="badge badge-green">Connected</span>`;
      else if(existing.status === 'pending') actionHtml = `<span class="badge badge-gray">Pending</span>`;
      else actionHtml = `<button class="btn btn-small btn-primary" onclick="sendConnectionRequest('${u._id}')">Connect</button>`;
    }
    return `<div class="row-item">
      <div class="row-left"><div class="avatar">${esc(initials(u.name))}</div>
        <div><div class="name">${esc(u.name)}</div><div class="meta">${esc(u.village||'')} ${u.phone?'· '+esc(u.phone):''}</div></div></div>
      <div class="row-actions">${actionHtml}</div>
    </div>`;
  }).join('');
}

function renderConnectedRow(c){
  const isFarmer = currentUser.role === 'farmer';
  const p = otherParty(c);
  let statusBadge = '';
  if(!isFarmer){
    // nothing extra for worker viewing a farmer
  } else {
    statusBadge = p.isAvailable
      ? `<span class="badge badge-green">Free${p.availabilityNote ? ': '+esc(p.availabilityNote) : ''}</span>`
      : `<span class="badge badge-gray">Not available</span>`;
  }
  return `<div class="row-item">
    <div class="row-left"><div class="avatar">${esc(initials(p.name))}</div>
      <div><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.village||'')} ${p.phone?'· '+esc(p.phone):''}</div></div></div>
    <div class="row-actions">
      ${statusBadge}
      <button class="btn btn-small btn-gold" onclick="toggleForm('wr-form-${p._id}')">Request Work</button>
      <button class="btn btn-small btn-danger" onclick="removeConnection('${c._id}')">Remove</button>
    </div>
    <div class="add-form" id="wr-form-${p._id}" style="width:100%; margin-top:10px;">
      <div class="field" style="flex:1; min-width:160px;"><label>Message</label><input type="text" id="wr-msg-${p._id}" placeholder="e.g. Need help harvesting cotton"></div>
      <div class="field"><label>Proposed Date</label><input type="date" id="wr-date-${p._id}" value="${todayStr()}"></div>
      <button class="btn btn-small btn-primary" onclick="sendWorkRequest('${p._id}')">Send</button>
    </div>
  </div>`;
}

function renderWorkRequestsPanel(){
  if(!workRequests.length) return '';
  const rows = workRequests.map(wr => {
    const isFarmer = currentUser.role === 'farmer';
    const p = isFarmer ? wr.worker : wr.farmer;
    const iSent = wr.initiatedBy === currentUser.role;
    let actions = `<span class="badge ${wr.status==='accepted'?'badge-green':wr.status==='declined'?'badge-rust':'badge-gray'}">${wr.status}</span>`;
    if(wr.status === 'pending' && !iSent){
      actions = `<button class="btn btn-small btn-primary" onclick="respondWorkRequest('${wr._id}','accept')">Accept</button>
                 <button class="btn btn-small btn-danger" onclick="respondWorkRequest('${wr._id}','decline')">Decline</button>`;
    }
    return `<div class="row-item">
      <div class="row-left"><div class="avatar">${esc(initials(p?.name))}</div>
        <div><div class="name">${esc(p?.name||'Unknown')} ${iSent?'<span class="meta">(you sent this)</span>':''}</div>
        <div class="meta">${esc(wr.message||'')} ${wr.proposedDate ? '· '+esc(wr.proposedDate) : ''}</div></div></div>
      <div class="row-actions">${actions}</div>
    </div>`;
  }).join('');
  return `<div class="panel"><h4>Work Requests</h4>${rows}</div>`;
}

function renderMyWorkTab(){

  }

  const list = myWorkerLabours.map(l => {
    const earned = labourEarned(l), paid = labourPaid(l), due = labourDue(l);

    const paymentRows = (l.payments||[]).slice().sort(byDateDesc).map(p=>`<tr><td class="txt">${esc(p.date)}</td><td>${fmt(p.amount)}</td><td class="txt">${esc(p.reason||'—')}</td></tr>`).join('') || `<tr><td colspan="3" class="empty-row">No payments recorded yet.</td></tr>`;
    return `
    <div class="card ${expanded}">

        <div class="card-title"><div class="avatar">🚜</div><div><h3>${esc(l.farmer?.name||'Farmer')}</h3><div class="sub">${esc(l.farmer?.village||'')}</div></div></div>
        <div class="card-figures">
          <div class="fig"><div class="flabel">Earned</div><div class="fvalue">${fmt(earned)}</div></div>
          <div class="fig"><div class="flabel">Paid</div><div class="fvalue" style="color:var(--gold)">${fmt(paid)}</div></div>
          <div class="fig"><div class="flabel">Due</div><div class="fvalue" style="color:${due>0?'var(--rust)':'var(--pine)'}">${fmt(due)}</div></div>
          <span class="chev">▾</span>
        </div>
      </div>
      <div class="card-body">
        <div class="subgrid">
          <div class="sub-block"><h4>Work Days</h4><table class="mini"><thead><tr><th>Date</th><th>Wage</th></tr></thead><tbody>${workdayRows}</tbody></table></div>
          <div class="sub-block"><h4>Payments</h4><table class="mini"><thead><tr><th>Date</th><th>Amount</th><th>Reason</th></tr></thead><tbody>${paymentRows}</tbody></table></div>
        </div>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="summary-strip">
    <div class="stat"><div class="label">Farmers</div><div class="value">${myWorkerLabours.length}</div></div>
    <div class="stat"><div class="label">Total Earned</div><div class="value">${fmt(totalEarned)}</div></div>
    <div class="stat"><div class="label">Total Paid</div><div class="value gold">${fmt(totalPaid)}</div></div>
    <div class="stat"><div class="label">Balance Due</div><div class="value rust">${fmt(totalDue)}</div></div>
  </div>
  <div class="section-head"><h2>My Work</h2></div>
  <div id="mywork-list">${list}</div>`;
}
